<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoStream Portal</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --card-bg: #fff;
            --text-color: #111;
            --sub-text: #606060;
            --border-color: #e5e5e5;
            --hover-color: #f2f2f2;
            --primary-color: #ff0000;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --card-bg: #212121;
            --text-color: #fff;
            --sub-text: #aaa;
            --border-color: #3d3d3d;
            --hover-color: #383838;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 100;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }
        .search-bar {
            display: flex;
            width: 40%;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 2px 0 0 2px;
            outline: none;
        }
        .search-bar button {
            padding: 8px 16px;
            background-color: var(--hover-color);
            border: 1px solid var(--border-color);
            border-left: none;
            color: var(--text-color);
            border-radius: 0 2px 2px 0;
            cursor: pointer;
        }
        .upload-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .upload-btn:hover {
            opacity: 0.9;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        /* Layout & Main Container */
        .main-container {
            display: flex;
            margin-top: 60px;
        }
        sidebar {
            width: 240px;
            background-color: var(--card-bg);
            height: calc(100vh - 60px);
            position: fixed;
            padding: 15px;
            border-right: 1px solid var(--border-color);
            z-index: 90;
        }
        sidebar.hide {
            display: none;
        }
        sidebar a {
            display: block;
            padding: 10px 12px;
            color: var(--text-color);
            text-decoration: none;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        sidebar a:hover {
            background-color: var(--hover-color);
        }
        /* Content Workspace */
        .content {
            margin-left: 240px;
            padding: 20px;
            width: 100%;
            transition: margin-left 0.2s;
        }
        .content.full-width {
            margin-left: 0;
        }
        /* Categories Workspace Bar */
        .category-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .category-chip {
            background-color: var(--hover-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .category-chip.active {
            background-color: var(--text-color);
            color: var(--card-bg);
        }
        /* Content Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .video-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        video {
            width: 100%;
            height: 180px;
            background-color: #000;
            display: block;
            object-fit: cover;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .video-channel {
            font-size: 13px;
            color: var(--sub-text);
            margin-bottom: 2px;
        }
        .video-meta {
            font-size: 13px;
            color: var(--sub-text);
        }
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            sidebar {
                transform: translateX(-100%);
                transition: transform 0.2s;
                display: block;
            }
            sidebar.show-mobile {
                transform: translateX(0);
            }
            .content {
                margin-left: 0;
            }
            .search-bar {
                display: none; /* Hides search on small devices for header layout space */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" id="menuToggle">☰</button>
            <a href="#" class="logo">VideoStream</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search videos by title or channel...">
            <button id="searchBtn">🔍</button>
        </div>
        <div class="header-right">
            <!-- File inputs are ugly by default, so we hide it and trigger it via the button -->
            <input type="file" id="videoFileInput" accept="video/mp4,video/webm" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('videoFileInput').click()">➕ Upload</button>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </header>

    <div class="main-container">
        <sidebar id="sidebar">
            <a href="#">🏠 Home</a>
            <a href="#">🔥 Trending</a>
            <a href="#">📁 Subscriptions</a>
            <a href="#">📚 Library</a>
        </sidebar>

        <div class="content" id="contentArea">
            <!-- Category Chips Filter Workspace Layout -->
            <div class="category-bar" id="categoryBar">
                <div class="category-chip active" data-category="all">All</div>
                <div class="category-chip" data-category="coding">Coding</div>
                <div class="category-chip" data-category="design">Design</div>
                <div class="category-chip" data-category="cloud">Cloud Tech</div>
                <div class="category-chip" data-category="user">My Uploads</div>
            </div>

            <div class="video-grid" id="videoGrid">
                <!-- Content injected dynamically via Javascript -->
            </div>
        </div>
    </div>

        let activeCategory = 'all';
        let searchQuery = '';

            {

                videoUrl: "movie3.mp4",
                category: "cloud"
            },
            {
                id: 4,
                title: "JavaScript Basics in 10 Minutes",
                channel: "DevChannel",
                views: "90K",
                timeAgo: "3 days ago",
                videoUrl: "movie4.mp4",
                category: "coding"
            }
        ];

        // 2. Render Process Engine
        function filterAndRenderFeed() {
            const videoGrid = document.getElementById('videoGrid');
            videoGrid.innerHTML = '';

            // Apply joint filtration criteria rules
            const filteredArray = videoDatabase.filter(video => {
                const matchesCategory = (activeCategory === 'all') || (video.category === activeCategory);
                const matchesSearch = video.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            // Render the filtered videos
            filteredArray.forEach(video => {
                const videoCard = createVideoCard(video);
                videoGrid.appendChild(videoCard);
            });
        }
