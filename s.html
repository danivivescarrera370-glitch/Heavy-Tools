<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoStream Portal</title>
    <style>
        /* 1. Design System Tokens (CSS Variables) */
        :root {
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #111111;
            --sub-text: #606060;
            --border-color: #e5e5e5;
            --hover-color: #f2f2f2;
        }

        /* Dark Mode Token Overrides */
        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --card-bg: #212121;
            --text-color: #ffffff;
            --sub-text: #aaaaaa;
            --border-color: #3d3d3d;
            --hover-color: #383838;
        }

        /* 2. Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 3. Layout Structure */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
            text-decoration: none;
        }
        .search-bar {
            display: flex;
            width: 40%;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 2px 0 0 2px;
            outline: none;
        }
        .search-bar button {
            padding: 8px 16px;
            background-color: var(--hover-color);
            border: 1px solid var(--border-color);
            border-left: none;
            color: var(--text-color);
            cursor: pointer;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
        }
        .theme-toggle:hover {
            background-color: var(--hover-color);
        }

        .main-container {
            display: flex;
            margin-top: 60px;
        }
        sidebar {
            width: 240px;
            background-color: var(--card-bg);
            height: calc(100vh - 60px);
            position: fixed;
            padding: 15px;
            border-right: 1px solid var(--border-color);
        }
        sidebar a {
            display: block;
            padding: 10px 12px;
            color: var(--text-color);
            text-decoration: none;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        sidebar a:hover {
            background-color: var(--hover-color);
        }

        /* 4. Video Grid Components */
        .content {
            margin-left: 240px;
            padding: 20px;
            width: 100%;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .video-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        video {
            width: 100%;
            height: 180px;
            background-color: #000000;
            display: block;
            object-fit: cover;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .video-channel {
            font-size: 13px;
            color: var(--sub-text);
            margin-bottom: 2px;
        }
        .video-meta {
            font-size: 13px;
            color: var(--sub-text);
        }

        @media (max-width: 768px) {
            sidebar { display: none; }
            .content { margin-left: 0; }
            .search-bar { width: 55%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="#" class="logo">VideoStream</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search videos...">
            <button>🔍</button>
        </div>
        <!-- Theme Toggle Button -->
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <div class="main-container">
        <sidebar>
            <a href="#">🏠 Home</a>
            <a href="#">🔥 Trending</a>
            <a href="#">📁 Subscriptions</a>
            <a href="#">📚 Library</a>
        </sidebar>

        <div class="content">
            <div class="video-grid" id="videoGrid">
                <!-- JavaScript will generate the video cards dynamically here -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DATA MODEL (Simulating your database)
        // ==========================================
        const videoData = [
            { id: 1, title: "Building a Modern Website from Scratch", channel: "DevChannel", views: "12K", time: "2 days ago", src: "movie1.mp4" },
            { id: 2, title: "Understanding HTML and CSS Grids", channel: "CodeSchool", views: "45K", time: "1 week ago", src: "movie2.mp4" },
            { id: 3, title: "Top Cloud Hosting Tips for 2026", channel: "TechInsights", views: "8.4K", time: "5 hours ago", src: "movie3.mp4" }
        ];

        // ==========================================
        // 2. RENDER PIPELINE
        // ==========================================
        function displayVideos(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            videos.forEach(video => {
                grid.innerHTML += `
                    <div class="video-card">
                        <video controls preload="metadata">
                            <source src="${video.src}" type="video/mp4">
                        </video>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-channel">${video.channel}</div>
                            <div class="video-meta">${video.views} views • ${video.time}</div>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // 3. PERSISTENT DARK MODE SYSTEM
        // ==========================================
        const themeToggle = document.getElementById('themeToggle');
        
        // Check local storage or user hardware preferences for default theme
        const savedTheme = localStorage.getItem('theme');
        const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && userPrefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        } else {
            document.documentElement.removeAttribute('data-theme');
            themeToggle.textContent = '🌙';
        }

        // Click event listener to toggle theme states
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀️';
            }
        });

        // ==========================================
        // 4. SEARCH AND INIT FILTER CONTROLS
        // ==========================================
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = videoData.filter(v => v.title.toLowerCase().includes(term));
            displayVideos(filtered);
        });

        // Initial launch render execution
        displayVideos(videoData);
    </script>
</body>
</html>
